# Publish a release when a version tag is pushed.
#
# Obsidian installs a plugin from a GitHub release's three assets —
# `main.js`, `manifest.json`, `styles.css` — and `main.js` is built, not
# committed, so the release is where it comes from. The tag must be the
# manifest's version exactly, with no leading "v", which is what Obsidian
# matches it against.
#
#   git tag 0.1.0 && git push origin 0.1.0
#
# A release candidate, tagged X.Y.Z-rcN (0.1.3-rc1, 0.1.3-rc2, ...), is
# published as a GitHub pre-release, for testing through BRAT. Tag it on a
# branch whose manifest.json and versions.json carry the rc version, and keep
# that bump off main: Obsidian's community updater reads main's manifest.json,
# so as long as main names the last stable version, regular users never see
# the candidate.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: write
  # For the attestation: a Sigstore signing certificate, and storing it.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag is the manifest's version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi
          if ! node -p "Object.hasOwn(require('./versions.json'), '$version')" | grep -q true; then
            echo "versions.json has no entry for $version" >&2
            exit 1
          fi

      - run: npm ci

      - name: Build and test
        run: npm test

      # Lets anyone check, with `gh attestation verify`, that the assets were
      # built here from this tag's source.
      - name: Attest the release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-rc*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
